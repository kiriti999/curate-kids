name: Deploy Bot to Deno Deploy

on:
  push:
    branches: main
    paths:
      - 'bot-deno/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "the-curate-kids"
          entrypoint: "main.ts"
          root: "bot-deno/src"
