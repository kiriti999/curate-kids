<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="telegramGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#229ED9"/>
      <stop offset="100%" style="stop-color:#1E88C9"/>
    </linearGradient>
    <linearGradient id="vercelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="denoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="mongoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00684A"/>
      <stop offset="100%" style="stop-color:#00ED64"/>
    </linearGradient>
    <linearGradient id="cloudinaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3448C5"/>
      <stop offset="100%" style="stop-color:#5C6BC0"/>
    </linearGradient>
    <linearGradient id="userGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">CuratedReels Architecture</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">High Level Design (HLD)</text>
  
  <!-- ===================== USERS SECTION ===================== -->
  
  <!-- Group Owner -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="140" height="120" rx="12" fill="url(#userGradient)" filter="url(#shadow)"/>
    <circle cx="70" cy="40" r="20" fill="#ffffff" opacity="0.2"/>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-size="20">👑</text>
    <text x="70" y="80" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Group Owner</text>
    <text x="70" y="100" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">(Admin)</text>
  </g>
  
  <!-- Contributors -->
  <g transform="translate(100, 340)">
    <rect x="0" y="0" width="140" height="120" rx="12" fill="#6366f1" filter="url(#shadow)"/>
    <circle cx="70" cy="40" r="20" fill="#ffffff" opacity="0.2"/>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-size="20">👥</text>
    <text x="70" y="80" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Contributors</text>
    <text x="70" y="100" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">(Group Members)</text>
  </g>
  
  <!-- Viewers -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="140" height="120" rx="12" fill="#3b82f6" filter="url(#shadow)"/>
    <circle cx="70" cy="40" r="20" fill="#ffffff" opacity="0.2"/>
    <text x="70" y="45" text-anchor="middle" fill="#ffffff" font-size="20">👁️</text>
    <text x="70" y="80" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Viewers</text>
    <text x="70" y="100" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">(Public Users)</text>
  </g>
  
  <!-- ===================== TELEGRAM BOT ===================== -->
  
  <g transform="translate(360, 200)">
    <rect x="0" y="0" width="200" height="180" rx="16" fill="url(#telegramGradient)" filter="url(#shadow)"/>
    <rect x="10" y="10" width="180" height="50" rx="8" fill="#ffffff" opacity="0.1"/>
    <text x="100" y="40" text-anchor="middle" fill="#ffffff" font-size="22">✈️</text>
    <text x="100" y="85" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Telegram Bot</text>
    <text x="100" y="110" text-anchor="middle" fill="#ffffff" opacity="0.9" font-size="11">• Video submissions</text>
    <text x="100" y="128" text-anchor="middle" fill="#ffffff" opacity="0.9" font-size="11">• Link accounts</text>
    <text x="100" y="146" text-anchor="middle" fill="#ffffff" opacity="0.9" font-size="11">• Group management</text>
    <text x="100" y="170" text-anchor="middle" fill="#ffffff" opacity="0.6" font-size="9">Deno Deploy</text>
  </g>
  
  <!-- ===================== NEXT.JS APP ===================== -->
  
  <g transform="translate(660, 120)">
    <rect x="0" y="0" width="240" height="340" rx="16" fill="url(#vercelGradient)" filter="url(#shadow)" stroke="#333" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="10" y="10" width="220" height="50" rx="8" fill="#ffffff" opacity="0.05"/>
    <text x="120" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Next.js + PayloadCMS</text>
    <text x="120" y="52" text-anchor="middle" fill="#ffffff" opacity="0.5" font-size="10">Vercel</text>
    
    <!-- Admin Panel Section -->
    <rect x="15" y="70" width="210" height="110" rx="8" fill="#7c3aed" opacity="0.3"/>
    <text x="120" y="95" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">🔧 Admin Panel</text>
    <text x="120" y="115" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">• Video moderation</text>
    <text x="120" y="132" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">• Category management</text>
    <text x="120" y="149" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">• User management</text>
    <text x="120" y="166" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">• Analytics</text>
    
    <!-- Frontend Section -->
    <rect x="15" y="190" width="210" height="80" rx="8" fill="#3b82f6" opacity="0.3"/>
    <text x="120" y="215" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">🌐 Public Frontend</text>
    <text x="120" y="235" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">• Video gallery</text>
    <text x="120" y="252" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">• Age-appropriate content</text>
    
    <!-- API Section -->
    <rect x="15" y="280" width="210" height="50" rx="8" fill="#10b981" opacity="0.3"/>
    <text x="120" y="305" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">📡 REST API</text>
    <text x="120" y="322" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">/api/*, /api/graphql</text>
  </g>
  
  <!-- ===================== MONGODB ===================== -->
  
  <g transform="translate(1000, 220)">
    <rect x="0" y="0" width="160" height="160" rx="16" fill="url(#mongoGradient)" filter="url(#shadow)"/>
    <text x="80" y="50" text-anchor="middle" fill="#ffffff" font-size="28">🍃</text>
    <text x="80" y="85" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">MongoDB</text>
    <text x="80" y="105" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Atlas</text>
    <text x="80" y="130" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">• Videos</text>
    <text x="80" y="145" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">• Users • Orgs</text>
  </g>
  
  <!-- ===================== CLOUDINARY ===================== -->
  
  <g transform="translate(1000, 430)">
    <rect x="0" y="0" width="160" height="120" rx="16" fill="url(#cloudinaryGradient)" filter="url(#shadow)"/>
    <text x="80" y="45" text-anchor="middle" fill="#ffffff" font-size="26">☁️</text>
    <text x="80" y="75" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Cloudinary</text>
    <text x="80" y="95" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="10">Video Storage</text>
    <text x="80" y="110" text-anchor="middle" fill="#94a3b8" font-size="9">(Optional)</text>
  </g>
  
  <!-- ===================== CONNECTIONS ===================== -->
  
  <!-- Users to Telegram Bot -->
  <line x1="240" y1="240" x2="350" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="400" x2="350" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Users to Frontend -->
  <path d="M 240 560 Q 400 560 660 400" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Telegram Bot to Next.js API -->
  <line x1="560" y1="290" x2="650" y2="320" stroke="#10b981" stroke-width="2" marker-end="url(#arrowheadGreen)"/>
  <text x="605" y="285" fill="#10b981" font-size="9" text-anchor="middle">Webhook</text>
  
  <!-- Next.js to MongoDB -->
  <line x1="900" y1="290" x2="990" y2="290" stroke="#00ED64" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Telegram Bot to MongoDB (direct) -->
  <path d="M 560 350 Q 750 500 990 350" fill="none" stroke="#00ED64" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="750" y="430" fill="#00ED64" font-size="9" text-anchor="middle">Direct DB</text>
  
  <!-- Next.js to Cloudinary -->
  <line x1="900" y1="400" x2="990" y2="470" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ===================== FLOW LEGEND ===================== -->
  
  <g transform="translate(40, 680)">
    <rect x="0" y="0" width="1120" height="100" rx="12" fill="#1e293b" opacity="0.8"/>
    <text x="560" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Data Flow</text>
    
    <!-- Legend items -->
    <g transform="translate(60, 45)">
      <line x1="0" y1="10" x2="40" y2="10" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="50" y="14" fill="#94a3b8" font-size="11">User Actions</text>
    </g>
    
    <g transform="translate(200, 45)">
      <line x1="0" y1="10" x2="40" y2="10" stroke="#10b981" stroke-width="2" marker-end="url(#arrowheadGreen)"/>
      <text x="50" y="14" fill="#10b981" font-size="11">Bot Webhook</text>
    </g>
    
    <g transform="translate(350, 45)">
      <line x1="0" y1="10" x2="40" y2="10" stroke="#00ED64" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="50" y="14" fill="#00ED64" font-size="11">Database Access</text>
    </g>
    
    <g transform="translate(520, 45)">
      <line x1="0" y1="10" x2="40" y2="10" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="50" y="14" fill="#3b82f6" font-size="11">Public Access</text>
    </g>
    
    <!-- Tech Stack -->
    <g transform="translate(700, 40)">
      <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="600">Tech Stack:</text>
      <text x="0" y="18" fill="#94a3b8" font-size="10">Next.js 16 • PayloadCMS • Deno • grammY • MongoDB • TypeScript</text>
      <text x="0" y="36" fill="#94a3b8" font-size="10">Deployed: Vercel (App) • Deno Deploy (Bot) • MongoDB Atlas (DB)</text>
    </g>
  </g>
  
  <!-- Version -->
  <text x="1170" y="790" text-anchor="end" fill="#64748b" font-size="10">v1.0 | CuratedReels</text>
</svg>
