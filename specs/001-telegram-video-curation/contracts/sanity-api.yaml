openapi: 3.0.3
info:
  title: Sanity CMS API Contract
  description: Interface for creating video documents in Sanity CMS from Telegram bot
  version: 1.0.0
  contact:
    name: CurateKids Bot Integration
    
servers:
  - url: https://{projectId}.api.sanity.io
    variables:
      projectId:
        default: '3rcl6ir9'
        description: Sanity project ID
    description: Sanity API endpoint

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sanity API token with write permissions

  schemas:
    VideoCategory:
      type: string
      enum:
        - education
        - entertainment
        - music
        - science
        - arts-crafts
        - sports
        - nature
        - stories
      description: Video category selected by curator
      
    AgeRange:
      type: string
      enum:
        - '0-2'
        - '3-5'
        - '6-8'
        - '9-12'
        - '13+'
      description: Age range determined by Telegram group
      
    VideoSubmission:
      type: object
      required:
        - _type
        - title
        - youtubeUrl
        - youtubeId
        - category
        - ageRange
        - status
        - tags
      properties:
        _type:
          type: string
          enum:
            - video
          description: Sanity document type
          example: video
        title:
          type: string
          maxLength: 200
          description: Video title extracted from YouTube
          example: "Learning Colors with Fun Animations"
        youtubeUrl:
          type: string
          format: uri
          pattern: '^(https?:\/\/)?(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})'
          description: Full YouTube URL
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        youtubeId:
          type: string
          minLength: 11
          maxLength: 11
          pattern: '^[a-zA-Z0-9_-]{11}$'
          description: YouTube video ID (11 characters)
          example: "dQw4w9WgXcQ"
        category:
          $ref: '#/components/schemas/VideoCategory'
        ageRange:
          $ref: '#/components/schemas/AgeRange'
        status:
          type: string
          enum:
            - pending
          description: Video review status (bot always sets to pending)
          example: pending
        tags:
          type: array
          items:
            type: string
          maxItems: 20
          description: Tags for video (initially empty)
          example: []
          
    SanityMutationResponse:
      type: object
      properties:
        transactionId:
          type: string
          description: Unique transaction identifier
        documentId:
          type: string
          description: Created document ID
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              operation:
                type: string
                enum:
                  - create
                  - update
              document:
                $ref: '#/components/schemas/VideoDocument'
                
    VideoDocument:
      allOf:
        - $ref: '#/components/schemas/VideoSubmission'
        - type: object
          properties:
            _id:
              type: string
              description: Sanity-generated document ID
              example: "drafts.abc123def456"
            _createdAt:
              type: string
              format: date-time
              description: Document creation timestamp
            _updatedAt:
              type: string
              format: date-time
              description: Document last update timestamp
            slug:
              type: object
              properties:
                current:
                  type: string
                  description: Auto-generated slug from title
                  example: "learning-colors-with-fun-animations"
                  
    SanityError:
      type: object
      properties:
        error:
          type: object
          properties:
            description:
              type: string
              description: Human-readable error message
            type:
              type: string
              description: Error type
              enum:
                - authenticationError
                - validationError
                - queryError
                - unknownError
            statusCode:
              type: integer
              description: HTTP status code
              
paths:
  /v2021-06-07/data/mutate/{dataset}:
    post:
      summary: Create video document
      description: |
        Creates a new video document in Sanity CMS with metadata from Telegram bot.
        This endpoint is used after a curator selects a category for a shared YouTube video.
      operationId: createVideoDocument
      tags:
        - Videos
      security:
        - BearerAuth: []
      parameters:
        - name: dataset
          in: path
          required: true
          schema:
            type: string
            default: production
          description: Sanity dataset name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mutations
              properties:
                mutations:
                  type: array
                  items:
                    type: object
                    required:
                      - create
                    properties:
                      create:
                        $ref: '#/components/schemas/VideoSubmission'
            example:
              mutations:
                - create:
                    _type: video
                    title: "Learning Colors with Fun Animations"
                    youtubeUrl: "https://www.youtube.com/watch?v=abc123def45"
                    youtubeId: "abc123def45"
                    category: education
                    ageRange: "3-5"
                    status: pending
                    tags: []
                    
      responses:
        '200':
          description: Video document created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanityMutationResponse'
              example:
                transactionId: "tx-abc123"
                documentId: "drafts.video-abc123"
                results:
                  - id: "drafts.video-abc123"
                    operation: create
                    document:
                      _id: "drafts.video-abc123"
                      _type: video
                      _createdAt: "2025-01-20T12:00:00Z"
                      _updatedAt: "2025-01-20T12:00:00Z"
                      title: "Learning Colors with Fun Animations"
                      slug:
                        current: "learning-colors-with-fun-animations"
                      youtubeUrl: "https://www.youtube.com/watch?v=abc123def45"
                      youtubeId: "abc123def45"
                      category: education
                      ageRange: "3-5"
                      status: pending
                      tags: []
                      
        '400':
          description: Validation error (invalid payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanityError'
              example:
                error:
                  description: "Validation failed: title is required"
                  type: validationError
                  statusCode: 400
                  
        '401':
          description: Authentication error (invalid or missing token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanityError'
              example:
                error:
                  description: "Invalid credentials"
                  type: authenticationError
                  statusCode: 401
                  
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanityError'
              example:
                error:
                  description: "Too many requests"
                  type: queryError
                  statusCode: 429
                  
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanityError'
              example:
                error:
                  description: "Internal server error"
                  type: unknownError
                  statusCode: 500

# TypeScript Interface Definition
# (For bot implementation reference)
x-typescript-definitions: |
  import { SanityClient } from '@sanity/client';
  
  /**
   * Sanity service interface for bot
   */
  export interface ISanityService {
    /**
     * Create a video document from Telegram submission
     * @param submission - Video metadata and category
     * @returns Created document ID
     * @throws SanityError on API failures
     */
    createVideo(submission: VideoSubmission): Promise<string>;
  }
  
  /**
   * Implementation with retry logic
   */
  export class SanityService implements ISanityService {
    constructor(
      private client: SanityClient,
      private retryAttempts: number = 3,
      private retryDelay: number = 2000
    ) {}
    
    async createVideo(submission: VideoSubmission): Promise<string> {
      const mutation = {
        create: submission
      };
      
      // Retry logic with exponential backoff
      let lastError: Error;
      for (let attempt = 1; attempt <= this.retryAttempts; attempt++) {
        try {
          const result = await this.client.create(submission);
          return result._id;
        } catch (error) {
          lastError = error as Error;
          
          // Don't retry on validation errors (400)
          if (this.isValidationError(error)) {
            throw error;
          }
          
          // Wait before retry (exponential backoff)
          if (attempt < this.retryAttempts) {
            await this.sleep(this.retryDelay * Math.pow(2, attempt - 1));
          }
        }
      }
      
      // All retries failed
      throw new Error(`Failed to create video after ${this.retryAttempts} attempts: ${lastError.message}`);
    }
    
    private isValidationError(error: any): boolean {
      return error.statusCode === 400;
    }
    
    private sleep(ms: number): Promise<void> {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  }
  
  /**
   * Configuration
   */
  export interface SanityConfig {
    projectId: string;
    dataset: string;
    token: string;
    apiVersion: string;
    useCdn: boolean;
  }
  
  /**
   * Initialize Sanity client
   */
  export function createSanityClient(config: SanityConfig): SanityClient {
    return new SanityClient({
      projectId: config.projectId,
      dataset: config.dataset,
      token: config.token,
      apiVersion: config.apiVersion,
      useCdn: config.useCdn,
    });
  }
